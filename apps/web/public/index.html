<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>planted</title>
    <meta
      name="description"
      content="A free, real-time multiplayer strat board for Rainbow Six Siege. Pre-alpha."
    />
    <meta name="color-scheme" content="dark light" />
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #ededed;
        --muted: #a1a1a1;
        --border: #2e2e2e;
        --green: #3fb950;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #171717;
          --muted: #636363;
          --border: #e5e5e5;
          --green: #1a7f37;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 480px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
      }
      p {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      a {
        color: var(--fg);
        text-underline-offset: 3px;
        border-radius: 4px;
      }
      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="dot" aria-hidden="true"></span>planted</h1>
      <p>A free, real-time multiplayer strat board for Rainbow Six Siege.</p>
      <p class="muted">
        Pre-alpha: nothing to try yet. Follow along on
        <a href="https://github.com/rosdal/planted">GitHub</a>.
      </p>
    </main>
  </body>
</html>
