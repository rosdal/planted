services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planted
      POSTGRES_PASSWORD: planted
      POSTGRES_DB: planted
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planted"]
      interval: 2s
      retries: 15
volumes:
  pgdata:
