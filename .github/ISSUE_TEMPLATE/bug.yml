name: Bug
description: Something in Planted behaves other than expected
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Which map/site?
      description: For example "Clubhouse, CCTV / Cash". Leave empty if it is not map-specific.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a room
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, Windows 11
  - type: input
    id: room
    attributes:
      label: Room link or strat id
      description: Only if you are fine with us opening it.
