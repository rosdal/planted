name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planted
          POSTGRES_PASSWORD: planted
          POSTGRES_DB: planted_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U planted"
          --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://planted:planted@localhost:5433/planted_test
      TEST_DATABASE_URL: postgres://planted:planted@localhost:5433/planted_test
      VITE_API_URL: http://localhost:3000
      # Wall-id stability is checked against the live release once one exists.
      CONTENT_BASELINE_URL: ${{ vars.CONTENT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: No ungenerated migrations
        run: |
          pnpm db:generate
          git add --intent-to-add packages/db/migrations
          git diff --exit-code packages/db/migrations
      - run: pnpm db:migrate
      - run: pnpm check
      - name: Content build is deterministic
        run: |
          pnpm --filter @planted/content content:build --out "$RUNNER_TEMP/content-a"
          pnpm --filter @planted/content content:build --out "$RUNNER_TEMP/content-b"
          diff -r "$RUNNER_TEMP/content-a" "$RUNNER_TEMP/content-b"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
