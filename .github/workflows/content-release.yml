name: content-release
# Publishes a content version to R2 when a `content-v<version>` tag is pushed, e.g.
# `git tag content-vy11s3.2 && git push --tags`. See packages/content/README.md, "Releases".
on:
  push:
    tags: ["content-v*"]
concurrency:
  group: content-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the R2 secrets; add required reviewers there to gate publishing.
    environment: content-release
    env:
      CONTENT_BASELINE_URL: ${{ vars.CONTENT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - run: pnpm content:build
      - run: pnpm --filter @planted/content content:release
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
