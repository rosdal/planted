packages:
  - apps/*
  - packages/*
  - scripts
allowBuilds:
  # Optional native CBOR decoder; cbor-x falls back to plain JS, which is fast enough.
  cbor-extract: false
  esbuild: true
  lefthook: true
catalog:
  typescript: ^5
  vitest: ^3
  "@vitest/coverage-v8": ^3
  "@types/node": ^24
  zod: ^4.6.7
  # One copy of Yjs across the workspace: two copies break its `instanceof` checks.
  yjs: ^13.6.33
  y-protocols: ^1.0.7
  lib0: ^0.2.119
  fast-check: ^4.10.2
  ws: ^8.22.0
  "@types/ws": ^8.18.2
  pixi.js: ^8.22.0
  "@playwright/test": ^1.64.1
